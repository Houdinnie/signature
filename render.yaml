services:
  - type: web
    name: signature-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signature-db
          property: connectionString
      - key: REDIS_URL
        value: redis://redis:6379/0
      - key: ENVIRONMENT
        value: production
    
  - type: web
    name: signature-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://signature-backend.onrender.com
      - key: NODE_ENV
        value: production
    
  - type: pserv
    name: signature-db
    ipAllowList: []
    plan: free
    
  - type: redis
    name: redis
    ipAllowList: []
    plan: free
